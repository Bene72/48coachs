name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 8 * * *'   # tous les jours à 8h00 UTC
  workflow_dispatch:       # lancement manuel possible (onglet Actions)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (lecture table ul_data)
        env:
          # Utilise les secrets GitHub s'ils existent, sinon les valeurs publiques du site.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vsjhtfbzxcvhantahwxq.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzamh0ZmJ6eGN2aGFudGFod3hxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODYxMDQsImV4cCI6MjA5NjI2MjEwNH0.ekSB47-Fn7U6-R6D34pWb86j64TbPGQa3BUoB0rM6JU' }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/ul_data?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
          echo "OK - Supabase a répondu."
